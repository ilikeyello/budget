<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BudgetBuddy</title>
<link rel="icon" type="image/png" href="BudgetBuddyTransparent.png">
<link rel="apple-touch-icon" href="BudgetBuddy.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#48B577">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--surface);
  color: var(--text);
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
:root {
  --primary: #48B577;
  --primary-light: #DCF2E5;
  --primary-lighter: #F0F9F3;
  --primary-dark: #2D8A55;
  --surface: #F4F9F6;
  --card: #FFFFFF;
  --text: #1B3327;
  --text-secondary: #5A7D68;
  --text-tertiary: #8FAA9B;
  --border: #D8ECE0;
  --border-light: #E8F4ED;
  --shadow-sm: 0 1px 3px rgba(30,60,40,0.06);
  --shadow-md: 0 4px 16px rgba(30,60,40,0.08);
  --shadow-lg: 0 8px 32px rgba(30,60,40,0.10);
  --radius: 16px;
  --radius-lg: 24px;
  --radius-pill: 999px;
  --danger: #E85D5D;
  --warning: #E8A440;
}
h1 { font-size: 28px; font-weight: 800; line-height: 1.2; }
h2 { font-size: 22px; font-weight: 700; line-height: 1.3; }
h3 { font-size: 18px; font-weight: 700; line-height: 1.4; }
p { line-height: 1.6; }
button {
  font-family: 'Nunito', sans-serif;
  cursor: pointer;
  border: none;
  outline: none;
  font-weight: 600;
  transition: all 0.2s ease;
}
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 12px 28px; border-radius: var(--radius-pill);
  font-size: 16px; font-weight: 700;
}
.btn-primary {
  background: var(--primary); color: white;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 35%, transparent);
}
.btn-primary:hover:not(:disabled) {
  background: var(--primary-dark); transform: translateY(-1px);
  box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 40%, transparent);
}
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--primary-light); color: var(--primary-dark); }
.btn-secondary:hover { background: var(--primary); color: white; }
.btn-ghost { background: transparent; color: var(--text-secondary); padding: 12px 16px; }
.btn-ghost:hover { color: var(--text); background: var(--primary-lighter); border-radius: var(--radius-pill); }
.input-field {
  font-family: 'Nunito', sans-serif;
  width: 100%; padding: 14px 18px;
  border: 2px solid var(--border); border-radius: 14px;
  font-size: 16px; font-weight: 500; color: var(--text);
  background: var(--card); transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
.input-field:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 15%, transparent);
}
.input-field::placeholder { color: var(--text-tertiary); }
.input-field.input-lg { font-size: 32px; font-weight: 800; padding: 16px 20px; }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 8px; border-radius: 4px;
  outline: none; background: var(--border);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--primary); cursor: pointer;
  border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transition: transform 0.15s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--primary); cursor: pointer;
  border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
input[type="range"]::-moz-range-track { background: transparent; }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes dotBounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-8px); }
}
.anim-in { animation: fadeInUp 0.45s ease-out both; }
.anim-scale { animation: scaleIn 0.4s ease-out both; }
.anim-fade { animation: fadeIn 0.4s ease-out both; }
@media (max-width: 600px) {
  h1 { font-size: 24px; }
  .btn { padding: 11px 22px; font-size: 15px; }
  .input-field.input-lg { font-size: 26px; }
  .dashboard-main-grid { grid-template-columns: 1fr !important; }
  .tx-form, .bill-form { flex-direction: column !important; align-items: stretch !important; }
  .tx-form > *, .bill-form > * { width: 100% !important; flex: none !important; }
  .rollover-item { flex-direction: column; align-items: stretch !important; gap: 8px !important; }
  .header-actions { width: 100%; justify-content: flex-start; margin-top: 8px; }
}
</style>
</head>

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

</html>
